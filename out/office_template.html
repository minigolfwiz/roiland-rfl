/* The Conference Office desk, rebuilt for the pro league: pick a division, pick a club,
   and the twenty-week strip tells you where each of its 18 games can legally go. */
:root{
  --bg:#f1f4f6; --card:#ffffff; --fg:#15202a; --dim:#5a6a77; --rule:#d5dee5; --chip:#e7edf2;
  --home:#2c6a4f; --road:#36608d; --accent:#1d3f6e; --good:#2c6a4f; --cut:#a83a32; --warn:#9a5c0c;
  --n:#1f56b8; --n2:#6aa2ef; --w:#6f2c91; --w2:#b98ad6; --s:#b8322a; --s2:#ee8a79; --e:#0b7a62; --e2:#56c1a3;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --data:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --card:#16202a; --fg:#e7edf2; --dim:#93a4b2; --rule:#283542; --chip:#1f2b37;
  --home:#73c49f; --road:#8db6e3; --accent:#9cc2f2; --good:#73c49f; --cut:#ec8a80; --warn:#e3a95a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --card:#16202a; --fg:#e7edf2; --dim:#93a4b2; --rule:#283542; --chip:#1f2b37;
  --home:#73c49f; --road:#8db6e3; --accent:#9cc2f2; --good:#73c49f; --cut:#ec8a80; --warn:#e3a95a; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--bg)}
.wrap{max-width:1380px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);padding-block:10px;margin-bottom:14px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:24px;margin:0;letter-spacing:.01em}
.yr{font-family:var(--display);font-weight:700;font-size:13px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.spacer{flex:1 1 auto}
.savestate{font-family:var(--data);font-size:11px;color:var(--dim)}
.savestate.ok{color:var(--good)} .savestate.bad{color:var(--cut)} .savestate.dirty{color:var(--warn)}
h2.sec{font-family:var(--display);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;
  margin:20px 0 9px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:5px}
h2.sec em{font-style:normal;color:var(--fg);letter-spacing:0;text-transform:none;font-family:var(--body);font-weight:500;font-size:13.5px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiny{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 11px;border:1px solid var(--rule);background:var(--card);border-radius:999px}
.tiny.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tiny.danger{color:var(--cut)}
.note{font-size:13.5px;color:var(--dim);margin:8px 0 0;max-width:90ch}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 0}
.chipdot{display:inline-block;width:11px;height:11px;flex:none}
.chipdot.R{border-radius:50%} .chipdot.M{transform:rotate(45deg) scale(.85);border-radius:2px}

/* division picker */
.confs{display:grid;gap:8px}
.confrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.confrow > span{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;width:84px;color:var(--dim)}
.dbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:6px 10px}
.dbtn b{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.dbtn span{font-family:var(--data);font-size:10.5px;color:var(--dim)}
.dbtn.done span{color:var(--good)} .dbtn.warn span{color:var(--warn)}
.dbtn[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}

.cols{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:880px){.cols{grid-template-columns:minmax(0,1fr)}}
.rail{border:1px solid var(--rule);border-radius:10px;background:var(--card);overflow:hidden}
.trow{display:flex;gap:8px;align-items:center;padding:8px 10px;border:0;border-bottom:1px solid var(--rule);width:100%;text-align:left;background:none;border-left:3px solid transparent}
.trow:last-child{border-bottom:none}
.trow[aria-pressed="true"]{background:var(--chip);border-left-color:var(--fg)}
.trow b{font-weight:600;font-size:14px;flex:1 1 auto;min-width:0}
.pill{font-family:var(--data);font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--rule);color:var(--dim);white-space:nowrap}
.pill.done{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--rule))}
.pill.bad{color:var(--cut);border-color:color-mix(in srgb,var(--cut) 45%,var(--rule))}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
@media (max-width:1000px){.strip{grid-template-columns:repeat(5,minmax(0,1fr))}}
.wk{border:1px solid var(--rule);border-radius:7px;background:var(--card);padding:6px 6px;min-height:82px;display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;min-width:0}
.wk .wn{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--dim)}
.wk .op{font-size:12.5px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.wk .vs{font-family:var(--data);font-size:9.5px;color:var(--dim)}
.wk.bye{background:transparent;border-style:dashed}
.wk.bye .op{color:var(--dim);font-weight:400;font-style:italic}
.wk.game{background:color-mix(in srgb,var(--dc) 13%,var(--card));border:2px solid var(--dc)}
.wk.away{border-style:dotted;border-width:3px;padding:5px 5px}
.wk .vs b{color:var(--fg);font-weight:600}
.wk.legal{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.wk.illegal{opacity:.42}
.wk .why{font-family:var(--data);font-size:9px;color:var(--cut);margin-top:auto}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--rule);background:var(--card);border-radius:7px;padding:5px 9px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .hv{font-family:var(--data);font-size:9.5px;color:var(--dim)}
.chip[aria-pressed="true"] .hv{color:inherit;opacity:.8}
.chip.away{border-style:dotted;border-width:2px}
.divico{vertical-align:-1px;margin-right:1px} .trow b .tm{max-width:100%} .wk .op .tm{font-size:11.5px;white-space:normal;line-height:1.25}

.tm{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;padding:1px 7px 1px 6px;border-radius:6px;border:1px solid rgba(0,0,0,.15);border-left:4px solid var(--ac);background:var(--bg);color:var(--fg);font-weight:600;white-space:nowrap;line-height:1.35}
.tm.sm{font-size:.92em;padding:0 6px 0 5px;border-left-width:3px}
.mk{display:inline-grid;vertical-align:middle;white-space:nowrap;line-height:1;font-weight:700;font-style:normal;text-transform:none;letter-spacing:.03em;padding:.12em .3em .2em;border-radius:.18em;background:var(--bg);border:3px solid var(--ac);color:var(--fg)}
.mk .l{grid-area:1/1;display:block;font:inherit;font-weight:700;font-style:normal;text-transform:none;letter-spacing:inherit;line-height:1;color:inherit;background:none;padding:0;margin:0;border:0;text-shadow:none}
.mk .halo{color:var(--halo);-webkit-text-stroke:calc(var(--sw) * 2 + 3px) var(--halo)}
.mk .drop{transform:translateY(.07em)} .mk .drop:not(.halo){color:var(--ac);-webkit-text-stroke:calc(var(--sw) * 2) var(--ac)}
.mk .edge{color:var(--ac);-webkit-text-stroke:calc(var(--sw) * 2) var(--ac)} .mk .fill{position:relative;color:var(--fg)}
.mk.plain .halo,.mk.plain .edge,.mk.edge .halo,.mk.noshadow .drop{display:none}


/* opponent sheet */
.sheet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.sheet{grid-template-columns:minmax(0,1fr)}}
.grp{border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:10px 12px;min-width:0}
.grp h3{margin:0 0 6px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.grp h3 small{font-family:var(--data);font-weight:400;font-size:10.5px;color:var(--dim);letter-spacing:0;text-transform:none}
.grp ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.grp li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:baseline;font-size:13.5px}
.grp li .ha{font-family:var(--data);font-size:10.5px}
.grp li .ha.h{color:var(--fg);font-weight:600} .grp li .ha.a{color:var(--dim)}
.grp li .dv{display:inline-flex;align-items:center;gap:5px;color:var(--dim);font-size:12px;white-space:nowrap}

.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:var(--card)}
.mx{border-collapse:collapse;font-family:var(--data);font-size:10.5px;width:100%}
.mx th{font-weight:400;color:var(--dim);padding:3px 3px;text-align:center;border-bottom:1px solid var(--rule)}
.mx th.tn{text-align:left;padding-right:8px;white-space:nowrap;font-family:var(--body);font-size:12.5px;color:var(--fg)}
.mx td{text-align:center;padding:2px 3px;border-bottom:1px solid var(--rule);white-space:nowrap}
.mx td.g{color:var(--fg);box-shadow:inset 3px 0 0 var(--dc);background:color-mix(in srgb,var(--dc) 10%,transparent)}
.mx td.a{text-decoration:underline dotted 2px;text-underline-offset:3px} .mx td.b{color:var(--rule)}
.issue{padding:5px 9px;border-left:3px solid;margin-bottom:4px;font-size:13.5px}
.issue.err{border-color:var(--cut)} .issue.wrn{border-color:var(--warn)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(14px);opacity:0;
  background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:7px;font-size:13.5px;pointer-events:none;transition:.18s;z-index:90}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
textarea{width:100%;min-height:90px;font-family:var(--data);font-size:11px;background:var(--card);color:var(--fg);border:1px solid var(--rule);border-radius:8px;padding:8px}
</style>

/* ---- rules (Dan): one game a week; two byes, the first in weeks 4–11 and the second in 12–18, at least 3 games between them;
   never more than two home or two road games in a row, and a bye does not reset the run; division rematches never in consecutive weeks ---- */
const BYE1 = [4, 11], BYE2 = [12, 18], GAP = 3;
function byeTrouble(t){
  const open = WEEKS.filter(w => SLOT[t][w] === null);
  const left = TG[t].filter(g => g.week === null).length;
  if (open.length - left < BYES) return 'that leaves only ' + (open.length - left) + ' bye weeks, needs ' + BYES;
  const inA = open.filter(w => w >= BYE1[0] && w <= BYE1[1]), inB = open.filter(w => w >= BYE2[0] && w <= BYE2[1]);
  if (!inA.length) return 'no week left open for a first bye in weeks ' + BYE1[0] + '–' + BYE1[1];
  if (!inB.length) return 'no week left open for a second bye in weeks ' + BYE2[0] + '–' + BYE2[1];
  if (left === 0){
    if (open.length !== BYES) return open.length + ' byes, needs ' + BYES;
    const [a, b] = open;
    if (a < BYE1[0] || a > BYE1[1]) return 'first bye in week ' + a + ', must be in weeks ' + BYE1[0] + '–' + BYE1[1];
    if (b < BYE2[0] || b > BYE2[1]) return 'second bye in week ' + b + ', must be in weeks ' + BYE2[0] + '–' + BYE2[1];
    if (b - a - 1 < GAP) return 'only ' + (b - a - 1) + ' games between the byes, needs ' + GAP;
  }
  return streakTrouble(t) || rematchTrouble(t);
}
// a run counts across byes; an OPEN week with games still to place is unknown and breaks the count for now
function streakTrouble(t){
  const left = TG[t].filter(g => g.week === null).length;
  let side = null, run = 0, from = 0;
  for (const w of WEEKS){
    const g = SLOT[t][w];
    if (!g){ if (left) { side = null; run = 0; } continue; }   // bye (or still-open week while placing)
    const s = g.host === t ? 'home' : 'road';
    if (s === side){ run++; } else { side = s; run = 1; from = w; }
    if (run > 2) return run + ' ' + side + ' games in a row from week ' + from;
  }
  return null;
}
function rematchTrouble(t){
  for (const w of WEEKS){ const g = SLOT[t][w], n = SLOT[t][w + 1];
    if (g && n && g.kind === 'division' && oppOf(g, t) === oppOf(n, t)) return 'plays ' + oppOf(g, t) + ' in weeks ' + w + ' and ' + (w + 1) + ' back to back'; }
  return null;
}
function whyNotWeek(g, w){
  for (const t of sides(g)){
    const s = atWeek(t, w);
    if (s && s !== g) return esc(t) + ' already plays ' + esc(oppOf(s, t));
  }
  const was = g.week; setWeek(g, w);
  let bad = null;
  for (const t of sides(g)){ const b = byeTrouble(t); if (b){ bad = esc(t) + ': ' + b; break; } }
  setWeek(g, was);
  return bad;
}
/* soft: rather not see the same opponent in back-to-back weeks */
function rematchNear(g, w){
  for (const t of sides(g)) for (const d of [-1, 1]){
    const o = SLOT[t][w + d]; if (o && o !== g && oppOf(o, t) === oppOf(g, t)) return true;
  }
  return false;
}

/* ---- actions ---- */
function hold(g){ held = (held === g) ? null : g; render(); }
function place(g, w){
  const bad = whyNotWeek(g, w);
  if (bad){ toast(bad.replace(/&amp;/g,'&')); return; }
  setWeek(g, w); TOUCHED.add(g.id); held = null; render(); queueSave();
}
function lift(g){ setWeek(g, null); TOUCHED.add(g.id); held = g; render(); queueSave(); }

function autoFill(want, quiet){
  const snap = games.map(g => g.week);
  const restore = () => { games.forEach(g => setWeek(g, null)); games.forEach((g, i) => setWeek(g, snap[i])); };
  const t0 = Date.now();
  for (let attempt = 0; attempt < 400; attempt++){
    restore();
    let left = games.filter(g => g.week === null && want(g));
    if (!left.length){ if (!quiet) toast('nothing open there'); return true; }
    const opts = new Map(), rec = g => opts.set(g, WEEKS.filter(w => whyNotWeek(g, w) === null));
    left.forEach(rec);
    const perWeek = {}; WEEKS.forEach(w => perWeek[w] = 0);
    games.forEach(g => { if (g.week !== null) perWeek[g.week]++; });
    let stuck = false;
    while (left.length){
      let best = null, bn = 1e9;
      for (const g of left){ const n = opts.get(g).length; if (!n){ stuck = true; break; } if (n < bn){ bn = n; best = g; if (n === 1) break; } }
      if (stuck) break;
      const w = opts.get(best).slice().sort((x, y) => ((rematchNear(best, x) - rematchNear(best, y)) * 10)
        || (perWeek[x] - perWeek[y]) || (Math.random() - .5))[0];
      setWeek(best, w); TOUCHED.add(best.id); perWeek[w]++;
      left = left.filter(g => g !== best); opts.delete(best);
      const hit = new Set(sides(best));
      for (const g of left) if (sides(g).some(t => hit.has(t))) rec(g);
    }
    if (!games.some(g => g.week === null && want(g))){
      held = null; if (!quiet){ render(); queueSave(); toast('filled in ' + (Date.now() - t0) + ' ms'); } return true;
    }
    if (Date.now() - t0 > 7000) break;
  }
  restore(); if (!quiet){ render(); toast('could not finish from here — lift a few games and try again'); }
  return false;
}

/* ---- render ---- */
function render(){ renderPicker(); renderSummary(); renderRail(); renderMain(); renderSheet(); renderOverview(); renderIssues(); renderBlob(); }
function divGames(d){ const r = new Set(d.roster); return games.filter(g => r.has(g.host) || r.has(g.visitor)); }
function divStat(d){
  const gs = divGames(d), placed = gs.filter(g => g.week !== null).length;
  const trouble = d.roster.some(t => !unplaced(t).length && byeTrouble(t));
  return {placed, total: gs.length, done: placed === gs.length, trouble};
}
function renderPicker(){
  el('picker').innerHTML = ['Regal','Majestic'].map(c => `<div class="confrow"><span>${c}</span>${
    DATA.divisions.filter(d => d.conf === c).map(d => { const st = divStat(d), t0 = d.roster[0];
      return `<button type="button" class="dbtn ${st.done ? (st.trouble ? 'warn' : 'done') : ''}" data-div="${esc(DIVKEY(d))}" aria-pressed="${d === cur}">
        ${dot(t0)}<b>${esc(d.div)}</b><span>${st.placed}/${st.total}${st.done ? (st.trouble ? ' · check' : ' · set') : ''}</span></button>`; }).join('')
  }</div>`).join('');
}
function renderSummary(){
  const all = games.length, done = games.filter(g => g.week !== null).length;
  const st = divStat(cur);
  el('summary').innerHTML = `<h2 class="sec">${esc(DIVKEY(cur))} ${DATA.year}
    <em>${st.placed} of ${st.total} games involving this division placed · league ${done}/${all}</em></h2>
    <p class="note">Each club plays its four division rivals home and away (8), two clubs from each other
    ${esc(cur.conf)} division, one home and one away (6), and one club from each division of the other
    conference, two home and two away (4). That is 18 games, 9 at home, over 20 weeks. Rules: the first bye in weeks 4–11 and the second in 12–18 with at least three games between them; never more than two home or two road games in a row (a bye does not reset the run); the two games against a division rival never in back-to-back weeks. The week strip refuses a placement that breaks a rule and the Checks panel lists anything outstanding.</p>
    <div class="bar">
      <button type="button" class="tiny primary" id="autoDiv">Fill ${esc(DIVKEY(cur))}</button>
      <button type="button" class="tiny" id="autoTeam">Fill ${esc(sel)} only</button>
      <button type="button" class="tiny" id="autoAll">Fill the whole league</button>
      <button type="button" class="tiny danger" id="clearTeam">Clear ${esc(sel)}</button>
      <button type="button" class="tiny danger" id="clearDiv">Clear ${esc(DIVKEY(cur))}</button>
    </div>`;
}
function renderRail(){
  el('railcount').textContent = cur.roster.length + ' clubs';
  el('rail').innerHTML = cur.roster.map(t => {
    const left = unplaced(t).length, tr = byeTrouble(t), cls = left === 0 ? (tr ? 'bad' : 'done') : '';
    return `<button type="button" class="trow" data-team="${esc(t)}" aria-pressed="${t === sel}"><b>${club(t, true)}</b>
      <span class="pill ${cls}">${left === 0 ? (tr ? 'check' : 'set') : left + ' left'}</span></button>`;
  }).join('');
}
function renderMain(){
  const t = sel, T = TI[t], open = unplaced(t);
  el('main').innerHTML = `<h2 class="sec">${mk(t, 22)} <em>${esc(T.stadium)}, ${esc(T.city)}, ${esc(T.state)}</em></h2>
    <div class="strip">${WEEKS.map(w => weekCard(t, w)).join('')}</div>
    <h2 class="sec">Still to place <em>${open.length ? 'tap one, then tap a week' : 'all placed'}</em></h2>
    <div class="chips">${open.map(g => `<button type="button" class="chip ${g.host === t ? '' : 'away'}" style="border-color:${colOf(oppOf(g, t))}" data-hold="${g.id}" aria-pressed="${held === g}">
        <span class="hv">${g.host === t ? 'VS' : '@'}</span>${clubn(oppOf(g, t), true)}<span class="hv">${KINDTAG[g.kind]}</span></button>`).join('')
      || '<span class="note">Nothing left for this club.</span>'}</div>
    <p class="note">Each game takes the colour of the opponent's division; the club chip carries the club's own colours with its division icon (▲ North, ◀ West, ▼ South, ▶ East; filled Regal, outlined Majestic). A <b>solid</b> outline is a home game and a
    <b>dotted</b> outline is a road game. Tap a placed week to lift that game back out.
    ${held ? '<b>Holding ' + esc(held.host === t || held.visitor === t ? oppOf(held, t) : held.host + ' v ' + held.visitor) + '</b>, the outlined weeks will take it.' : ''}</p>`;
}
function weekCard(t, w){
  const g = atWeek(t, w), cls = [], bits = [];
  let why = '', style = '';
  if (g){
    const home = g.host === t, o = oppOf(g, t);
    cls.push('game', home ? 'home' : 'away'); style = ` style="--dc:${colOf(o)}"`;
    bits.push(`<div class="op">${clubn(o, true)}</div>`, `<div class="vs">${home ? '<b>HOME</b>' : 'AWAY'} · ${KINDTAG[g.kind]}</div>`);
  } else if (held){
    const bad = whyNotWeek(held, w);
    cls.push(bad ? 'illegal' : 'legal'); if (bad) why = `<div class="why">${bad}</div>`;
    bits.push(`<div class="op">${bad ? '—' : 'place here'}</div>`);
  } else {
    cls.push('bye'); bits.push(`<div class="op">${unplaced(t).length ? 'open' : 'bye'}</div>`);
  }
  return `<button type="button" class="wk ${cls.join(' ')}" data-wk="${w}" data-gid="${g ? g.id : ''}"${style}><div class="wn">WK ${w}</div>${bits.join('')}${why}</button>`;
}
function renderSheet(){
  const t = sel, mine = TG[t];
  const grp = k => mine.filter(g => g.kind === k).slice().sort((a, b) => {
    const oa = oppOf(a, t), ob = oppOf(b, t);
    return (TI[oa].div + oa).localeCompare(TI[ob].div + ob) || ((b.host === t) - (a.host === t));
  });
  const block = k => { const gs = grp(k), h = gs.filter(g => g.host === t).length;
    return `<div class="grp"><h3>${KIND[k]} <small>${gs.length} games · ${h} home, ${gs.length - h} away</small></h3><ul>${
      gs.map(g => { const o = oppOf(g, t), home = g.host === t;
        return `<li><span class="ha ${home ? 'h' : 'a'}">${home ? 'HOME' : 'AWAY'}</span><span>${club(o, true)}</span>
          <span class="dv">${esc(TI[o].conf === TI[t].conf ? TI[o].div : TI[o].conf + ' ' + TI[o].div)}</span></li>`; }).join('')}</ul></div>`; };
  el('sheet').innerHTML = `<h2 class="sec">${esc(t)}: the 2042 opponents <em>${mine.filter(g => g.host === t).length} home, ${mine.filter(g => g.host !== t).length} away</em></h2>
    <div class="sheet">${block('division')}${block('conference')}${block('interconference')}</div>`;
}
function renderOverview(){
  const rows = cur.roster.map(t => `<tr><th class="tn">${clubn(t, true)}</th>${WEEKS.map(w => {
    const g = atWeek(t, w); if (!g) return '<td class="b">·</td>';
    const o = oppOf(g, t), home = g.host === t, short = TI[o].city.length > 9 ? TI[o].city.slice(0, 8) + '…' : TI[o].city;
    return `<td class="g ${home ? 'h' : 'a'}" style="--dc:${colOf(o)}" title="${esc((home ? 'hosts ' : 'at ') + o)}">${home ? '' : '@'}${esc(short)}</td>`;
  }).join('')}</tr>`).join('');
  el('overview').innerHTML = `<h2 class="sec">${esc(DIVKEY(cur))}, week by week <em>colour is the opponent's division · @ and a dotted underline mean a road game · a dot is a bye</em></h2>
    <div class="tablewrap"><table class="mx"><thead><tr><th class="tn"></th>${WEEKS.map(w => `<th>${w}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">League games per week: ${WEEKS.map(w => `<b>${w}</b>&nbsp;${games.filter(g => g.week === w).length}`).join(' · ')}.</p>`;
}
function renderIssues(){
  const errs = [], wrns = [];
  Object.keys(TI).forEach(t => {
    if (unplaced(t).length){ const st = streakTrouble(t) || rematchTrouble(t); if (st) wrns.push([t, st]); return; }
    const b = byesOf(t);
    if (TG[t].length !== GPT) errs.push([t, TG[t].length + ' games, needs ' + GPT]);
    const bt = byeTrouble(t); if (bt) errs.push([t, bt]);
    const st = streakTrouble(t); if (st && st !== bt) errs.push([t, st]);
    const rt = rematchTrouble(t); if (rt && rt !== bt) errs.push([t, rt]);
  });
  const r = new Set(cur.roster), mineFirst = a => a.filter(x => r.has(x[0])).concat(a.filter(x => !r.has(x[0])));
  const uniq = a => [...new Map(a.map(x => [x.join('|'), x])).values()];
  const E = mineFirst(uniq(errs)), W = mineFirst(uniq(wrns));
  el('issues').innerHTML = `<h2 class="sec">Checks <em>${E.length} blocking · ${W.length} to look at, ${esc(DIVKEY(cur))} first</em></h2>
    ${E.slice(0, 60).map(([t, m]) => `<div class="issue err"><b>${esc(t)}</b>: ${esc(m)}</div>`).join('')}
    ${W.slice(0, 60).map(([t, m]) => `<div class="issue wrn"><b>${esc(t)}</b>: ${esc(m)}</div>`).join('')}
    ${!E.length && !W.length ? '<p class="note">Nothing flagged. A club is checked once all 18 of its games are placed.</p>' : ''}`;
}
function renderBlob(){
  el('blob').value = JSON.stringify({ league: 'RFL', year: DATA.year, complete: games.every(g => g.week !== null),
    games: games.map(g => ({ host: g.host, visitor: g.visitor, kind: g.kind, week: g.week })) });
}

/* ---- persistence ---- */
const DOC = 'rfl/schedule' + DATA.year;
function setSave(m, c){ const n = el('savestate'); n.textContent = m; n.className = 'savestate' + (c ? ' ' + c : ''); }
async function connect(){
  setSave('loading…');
  try { db = await window.claude?.use?.('db'); } catch(e){ db = null; }
  if (!db){ loaded = true; setSave('saving unavailable — use the hand-off box', 'bad'); render(); return; }
  try {
    const body = bodyOf(await db.doc(DOC).get());
    if (body && Array.isArray(body.weeks)){
      const m = new Map(body.weeks.map(r => [r.id, r.week])); let n = 0;
      games.forEach(g => { const w = m.get(g.id); if (w !== undefined && w !== null && g.week === null && weekFree(g, w)){ setWeek(g, w); n++; } });
      setSave('restored ' + n + ' games' + (body.saved ? ' · saved ' + body.saved : ''), 'ok');
    } else setSave('ready');
  } catch(e){ db = null; loaded = true; setSave('could not read the saved board — copy the hand-off before you close', 'bad'); render(); return; }
  loaded = true; if (dirty) save(); render();
}
/* A document snapshot's body comes from data(), a function. Reading it as a property
   returned nothing, so the board never restored and a save could overwrite it. */
function bodyOf(snap){ if (!snap || snap.exists === false) return null;
  return typeof snap.data === 'function' ? snap.data() : (snap.data || null); }
function weekFree(g, w){ return sides(g).every(t => SLOT[t][w] === null || SLOT[t][w] === g); }
async function save(){
  if (!loaded || !db) return;
  try {
    let stored = null;
    const b0 = bodyOf(await db.doc(DOC).get());   // a failed read throws and aborts the save
    stored = b0 && Array.isArray(b0.weeks) ? new Map(b0.weeks.map(r => [r.id, r.week])) : null;
    let pulled = 0;
    if (stored) games.forEach(g => { if (TOUCHED.has(g.id)) return; const w = stored.get(g.id);
      if (w !== undefined && w !== null && g.week === null && weekFree(g, w)){ setWeek(g, w); pulled++; } });
    await db.doc(DOC).set({ year: DATA.year, weeks: games.map(g => ({ id: g.id, week: g.week })), saved: new Date().toLocaleString() });
    dirty = false; setSave('saved ' + new Date().toLocaleTimeString() + (pulled ? ' · merged ' + pulled + ' from another tab' : ''), 'ok');
    if (pulled) render();
  } catch(e){ setSave('save failed — copy the hand-off box', 'bad'); }
}
function queueSave(){ dirty = true; if (!loaded) return; setSave('unsaved…', 'dirty'); clearTimeout(saveTimer); saveTimer = setTimeout(save, 700); }
let tt = null;
function toast(m){ el('toast').textContent = m; el('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el('toast').classList.remove('show'), 2200); }

/* ---- events ---- */
document.addEventListener('click', e => {
  const db_ = e.target.closest('[data-div]');
  if (db_){ cur = DATA.divisions.find(d => DIVKEY(d) === db_.dataset.div); sel = cur.roster[0]; held = null; return render(); }
  const row = e.target.closest('[data-team]');
  if (row){ sel = row.dataset.team; held = null; return render(); }
  const chip = e.target.closest('[data-hold]');
  if (chip) return hold(games.find(g => g.id === chip.dataset.hold));
  const wk = e.target.closest('[data-wk]');
  if (wk){ const g = wk.dataset.gid ? games.find(x => x.id === wk.dataset.gid) : null;
    if (g) return lift(g); if (held) return place(held, +wk.dataset.wk); return; }
  const id = e.target.closest('button')?.id;
  const inDiv = g => cur.roster.includes(g.host) || cur.roster.includes(g.visitor);
  if (id === 'autoDiv') return void autoFill(inDiv);
  if (id === 'autoTeam') return void autoFill(g => g.host === sel || g.visitor === sel);
  if (id === 'autoAll'){
    let ok = false;
    for (let pass = 0; pass < 4 && !ok; pass++){
      ok = true;
      for (const d of DATA.divisions){
        const r = new Set(d.roster), f = g => r.has(g.host) || r.has(g.visitor);
        if (!games.some(g => g.week === null && f(g))) continue;
        if (!autoFill(f, true)){ ok = false;
          games.forEach(g => { if (f(g)){ setWeek(g, null); TOUCHED.add(g.id); } }); }
      }
    }
    held = null; render(); queueSave();
    const left = games.filter(g => g.week === null).length;
    return toast(left ? left + ' still unplaced — try those divisions on their own' : 'the whole league is placed');
  }
  if (id === 'clearTeam'){ TG[sel].forEach(g => { setWeek(g, null); TOUCHED.add(g.id); }); held = null; render(); return queueSave(); }
  if (id === 'clearDiv'){ games.forEach(g => { if (inDiv(g)){ setWeek(g, null); TOUCHED.add(g.id); } }); held = null; render(); return queueSave(); }
  if (id === 'saveBtn') return save();
  if (id === 'copyBtn'){ const v = el('blob').value;
    try { navigator.clipboard.writeText(v).then(() => toast('copied'), () => { el('blob').select(); toast('press ⌘C / Ctrl-C'); }); }
    catch(_){ el('blob').select(); toast('press ⌘C / Ctrl-C'); } return; }
  if (id === 'loadBtn'){ const ta = el('blob'); ta.readOnly = false; ta.value = ''; ta.focus();
    toast('paste a saved board, then tap Load it'); e.target.id = 'loadBtn2'; e.target.textContent = 'Load it'; return; }
  if (id === 'loadBtn2'){
    try { const d = JSON.parse(el('blob').value); let n = 0;
      (d.games || []).forEach(r => { const g = games.find(x => x.week === null && x.host === r.host && x.visitor === r.visitor && x.kind === r.kind);
        if (g && r.week != null && whyNotWeek(g, r.week) === null){ setWeek(g, r.week); TOUCHED.add(g.id); n++; } });
      toast('loaded ' + n + ' weeks');
    } catch(err){ toast('that is not a saved board'); }
    el('blob').readOnly = true; e.target.id = 'loadBtn'; e.target.textContent = 'Paste one back in'; render(); queueSave(); return;
  }
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape'){ held = null; return render(); }
  const i = cur.roster.indexOf(sel);
  if (e.key === 'j'){ sel = cur.roster[(i + 1) % 5]; held = null; render(); }
  if (e.key === 'k'){ sel = cur.roster[(i + 4) % 5]; held = null; render(); }
});
addEventListener('beforeunload', e => { if (dirty){ e.preventDefault(); e.returnValue = ''; } });

el('yrline').textContent = DATA.year + ' season · 40 clubs · 20 weeks';
seed(); buildIndex(); sel = cur.roster[0]; render(); connect();
</script>
