*{box-sizing:border-box} html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}

.tm{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;padding:1px 7px 1px 6px;border-radius:6px;border:1px solid rgba(0,0,0,.15);border-left:4px solid var(--ac);background:var(--bg);color:var(--fg);font-weight:600;white-space:nowrap;line-height:1.35}

.mk .l{grid-area:1/1;display:block;font:inherit;font-weight:700;font-style:normal;text-transform:none;letter-spacing:inherit;line-height:1;color:inherit;background:none;padding:0;margin:0;border:0;text-shadow:none}

body{padding-block:16px 80px}

    <div class="kv" style="margin-top:8px">${['passing','rushing','receiving','defence'].map(k => g.leaders[k].map(l => `<span><b>${k[0].toUpperCase()+k.slice(1)}</b> ${who(l.name, null, l.club)} (${esc(BRAND[l.club].nick)}) ${esc(l.line)}</span>`).join('')).join('')}</div>
    ${g.injuries.length ? `<div class="note">Injuries: ${g.injuries.map(i => `${who(i.name, null, i.team)} (${esc(BRAND[i.team].nick)} ${esc(i.pos)}) — ${esc(i.kind)}, ${i.weeks >= 20 ? 'out for the season' : i.weeks + ' wk' + (i.weeks > 1 ? 's' : '')}`).join('; ')}</div>` : ''}</div>`;
  return `<div class="gc" tabindex="0" role="button" data-g="${g.id}">
    <div class="row ${aw?'w':'l'}"><span>${g.seeds && g.seeds[g.away] ? '<small style="color:var(--dim)">(' + g.seeds[g.away] + ')</small> ' : ''}${chip(g.away, true)}</span><span class="sc">${g.away_pts}</span></div>
    <div class="row ${hw?'w':'l'}"><span>${g.seeds && g.seeds[g.home] ? '<small style="color:var(--dim)">(' + g.seeds[g.home] + ')</small> ' : ''}${chip(g.home, true)}</span><span class="sc">${g.home_pts}</span></div>
    <div class="meta"><span><span class="slot ${g.slot}">${SLOT[g.slot]}</span> ${g.ot ? '<b>OT</b> · ' : ''}${g.winner ? '' : '<b>TIE</b> · '}${esc(g.stadium)}, ${esc(g.city)}</span><span>${g.kind.toUpperCase().slice(0,5)}</span></div>${det}</div>`;
}
function weekView(){
  const r = D.results.find(x => x.week === week);
  let h = `<h2 class="w">Week ${week} <small style="font-family:var(--body);font-weight:500;font-size:13px;color:var(--dim)">${r ? r.games.length + ' games' : 'not yet played'}</small></h2>`;
  if (!r){ const gs = D.sched[week] || []; return h + '<div class="gl">' + gs.map(g => `<div class="gc"><div class="row"><span>${chip(g.visitor, true)}</span></div><div class="row"><span>at ${chip(g.host, true)}</span></div><div class="meta"><span class="slot ${g.slot}">${SLOT[g.slot]}</span></div></div>`).join('') + '</div>'; }
  const order = {thu:0, sun:1, snf:2, snf2:3, mnf:4};
  const gs = r.games.slice().sort((a,b) => order[a.slot] - order[b.slot] || Math.abs(a.home_pts - a.away_pts) - Math.abs(b.home_pts - b.away_pts));
  const prime = gs.filter(g => g.slot !== 'sun'), rest = gs.filter(g => g.slot === 'sun');
  h += '<h3>Stand-alone games</h3><div class="gl">' + prime.map(gameCard).join('') + '</div><h3>Sunday</h3><div class="gl">' + rest.map(gameCard).join('') + '</div>';
  if (r.moves && r.moves.length) h += '<h3>Transactions</h3><div class="kv">' + r.moves.map(m => `<span>${_chip(m.team, true, BRAND[m.team].nick)} signed ${esc(m.pos)} ${who(m.signed, null, m.team)} <em>(${esc(m.why)})</em>; released ${esc(m.cut)}</span>`).join('') + '</div>';
  if (r.changes && r.changes.length) h += '<h3>Lineup changes</h3><div class="kv">' + r.changes.map(c => `<span>${_chip(c.team, true, BRAND[c.team].nick)} ${esc(c.pos)}: ${who(c.inn, null, c.team)} starts for ${who(c.out, null, c.team)} <em>(${esc(c.why)})</em></span>`).join('') + '</div>';
  return h;
}
function standView(){
  const pct = t => { const r = D.records[t]; return (r[0] + r[2]/2) / Math.max(1, r[0]+r[1]+r[2]); };
  let h = '';
  for (const conf of ['Regal','Majestic']){ h += `<h3>${conf}</h3><div class="divgrid">`;
    for (const d in D.al[conf]){ const ts = D.al[conf][d].slice().sort((a,b) => pct(b) - pct(a));
      h += `<table class="st"><caption>${esc(d)}</caption>` + ts.map(t => `<tr><td>${_chip(t, true, NARROW.matches ? BRAND[t].nick : t)}</td><td>${rec(t)}</td><td>${pct(t).toFixed(3)}</td></tr>`).join('') + '</table>'; }
    h += '</div>'; }
  return h;
}
function leadView(){
  const L = D.lead, T = {pass_yds:'Passing yards', pass_td:'Passing TDs', rush_yds:'Rushing yards', rec_yds:'Receiving yards', sacks:'Sacks', int_made:'Interceptions', pts:'Kicking points'};
  return '<div class="lead">' + Object.keys(T).map(k => `<div><b>${T[k]}</b><ol>${L[k].map(x => `<li><span>${who(x.name, null, x.club)} <small style="color:var(--dim)">${esc(BRAND[x.club].nick)}</small></span><span>${x.v}</span></li>`).join('')}</ol></div>`).join('') + '</div>';
}
function injView(){
  const rows = D.injuries.slice().sort((a,b) => b.left - a.left);
  return rows.length ? `<div class="tw"><table class="st">${rows.map(i => `<tr><td>${_chip(i.team, true, BRAND[i.team].nick)} ${who(i.name, null, i.team)} <small style="color:var(--dim)">${esc(i.pos)}</small></td><td>${esc(i.kind)}</td><td>${i.left >= 20 ? 'season' : i.left + ' wk' + (i.left > 1 ? 's' : '')}</td></tr>`).join('')}</table></div>` : '<p class="note">No one on the injury list.</p>';
}
function awardView(){
  if (!D.awards) return '<p class="note">Awards are voted after the regular season.</p>';
  return '<div class="lead">' + Object.keys(D.awards).map(k => { const a = D.awards[k]; return `<div><b>${esc(k)}${a.award !== k ? ' · ' + esc(a.award) : ''}</b><ol>${a.finalists.map((f, i) => `<li><span>${a.winner && f.name === a.winner.name ? '🏆 ' : ''}${f.pos ? who(f.name, null, f.club) : esc(f.name)} <small style="color:var(--dim)">${esc(f.pos || 'HC')}, ${esc(BRAND[f.club].nick)} — ${esc(f.line)}</small></span></li>`).join('')}</ol></div>`; }).join('') + '</div>';
}
function poView(){
  if (!D.playoffs) return '<p class="note">Seeds are set after week 20.</p>';
  let h = '<p class="note">Eight seeds per conference, all by record (ties: head-to-head, division record, conference record, point differential); division winners qualify regardless. Reseeded after every round; the higher seed hosts until the Mega Bowl.</p>';
  for (const conf of ['Regal','Majestic']){ const s = D.playoffs.seeds[conf];
    h += `<h3>${conf}</h3><div class="tw"><table class="st">` + s.map((t, i) => `<tr><td>${i + 1}. ${_chip(t, true, NARROW.matches ? BRAND[t].nick : t)}</td><td>${rec(t)}</td></tr>`).join('') + '</table></div>';
    h += '<div class="kv">' + [[0,7],[1,6],[2,5],[3,4]].map(([a,b]) => `<span>${_chip(s[b], true, BRAND[s[b]].nick)} (${b+1}) at ${_chip(s[a], true, BRAND[s[a]].nick)} (${a+1})</span>`).join('') + '</div>'; }
  if (D.pgames){ for (const rd of D.pgames.rounds){ h += `<h3>${esc(rd.name)}</h3><div class="gl">` + rd.games.map(gameCard).join('') + '</div>'; } }
  return h;
}
function render(){
  ['week','stand','lead','inj','po','aw'].forEach(k => $('t-'+k).setAttribute('aria-pressed', tab === k));
  $('weeks').style.display = tab === 'week' ? 'flex' : 'none';
  $('weeks').innerHTML = Array.from({length:20}, (_, i) => i + 1).map(w => `<button class="tab${w > D.week_done ? ' todo' : ''}" type="button" data-w="${w}" aria-pressed="${w === week}">Wk ${w}</button>`).join('');
  $('out').innerHTML = tab === 'week' ? weekView() : tab === 'stand' ? standView() : tab === 'lead' ? leadView() : tab === 'inj' ? injView() : tab === 'po' ? poView() : awardView();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[id^="t-"]'); if (t && t.id.startsWith('t-') && t.classList.contains('tab') && !t.dataset.w){ tab = t.id.slice(2); render(); return; }
  const w = e.target.closest('#weeks .tab'); if (w){ week = +w.dataset.w; render(); return; }
  const wh = e.target.closest('.who'); if (wh){ e.stopPropagation(); openPlayer(wh.dataset.pid); return; }
  if (e.target.closest('[data-close]') || (e.target.id === 'ov')){ $('ov').classList.remove('on'); return; }
  const gc = e.target.closest('.gc[data-g]'); if (gc && !e.target.closest('.tm')) gc.classList.toggle('open');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('ov').classList.remove('on'); if (e.key === 'Enter' && e.target.classList.contains('who')) { openPlayer(e.target.dataset.pid); e.preventDefault(); return; } if (e.key === 'Enter' && e.target.classList.contains('gc')) e.target.classList.toggle('open'); });
render();
</script>
