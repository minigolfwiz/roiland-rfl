<title>Media Pool</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* The press box. Sixty credentials pinned to a board, one per voter, grouped by the
   conference that sent them; pick one and their ballot unrolls beside the composite. */
:root{
  --paper:#f4efe4; --ink:#1d1a15; --dim:#6b6355; --rule:#d8cfbb; --card:#fffdf7;
  --brass:#8a6410; --brass-soft:#b99a52; --chip:#e9e1cd; --up:#2f6b3a; --down:#9a3b2e;
  --display:"Spectral",Georgia,"Times New Roman",serif; --body:"Spectral",Georgia,serif;
  --data:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#17150f; --ink:#ece6d7; --dim:#938b78; --rule:#332e24; --card:#201d15;
  --brass:#d2ab5e; --brass-soft:#8a7542; --chip:#2a2619; --up:#7fbf8a; --down:#e0806f; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#17150f; --ink:#ece6d7; --dim:#938b78; --rule:#332e24; --card:#201d15;
  --brass:#d2ab5e; --brass-soft:#8a7542; --chip:#2a2619; --up:#7fbf8a; --down:#e0806f; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);margin:0;font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:22px 48px;padding-inline:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:12px}
h1{font-family:var(--display);font-size:20px;font-weight:600;margin:0}
.yr{font-family:var(--data);font-size:11.5px;color:var(--dim);letter-spacing:.14em}
p.lede{max-width:72ch;color:var(--dim);font-size:13.5px;margin:0 0 14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--rule);background:var(--card);color:var(--ink);
  padding:4px 10px;font-size:12px;font-family:var(--data);letter-spacing:.06em;text-transform:uppercase}
button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--paper);font-weight:700}
h2.conf{font-family:var(--data);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:20px 0 8px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:5px;padding:11px 12px;min-width:0;cursor:pointer;border-left-width:5px}
.card:hover{border-color:var(--brass-soft)}
.card[aria-pressed="true"]{outline:2px solid var(--brass)}
.card .nm{font-family:var(--display);font-weight:600;font-size:15.5px}
.card .nm small{font-weight:400;color:var(--dim);font-family:var(--data);font-size:11px;margin-left:6px}
.card .team{font-family:var(--data);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:1px 0 6px}
.card .bio{font-size:13px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.chip{font-family:var(--data);font-size:9.5px;letter-spacing:.05em;background:var(--chip);border-radius:3px;padding:1px 6px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--data);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:4px 6px;border-bottom:1px solid var(--rule)}
td{padding:3px 6px;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
td.r{text-align:right;font-family:var(--data);font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.mv{font-family:var(--data);font-size:11px}
.mv.up{color:var(--up)} .mv.down{color:var(--down)}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:5px;padding:12px 14px;margin-top:10px}
.panel h3{font-family:var(--display);margin:0 0 4px;font-size:16px}
.wk{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 10px}
.wk button{padding:2px 8px}
.empty{color:var(--dim);font-size:13.5px}
</style>

<header><h1>Media Pool</h1><span class="yr" id="yr"></span></header>
<p class="lede">Sixty voters — six from each power conference, four from each of the lower six — each filing a top 25 every week. The poll is the composite —
25 points for a first-place vote down to 1 for twenty-fifth. Click a credential to read that voter's ballot against the poll.</p>

   week k-1. The matching composite is composite['pre'] for 0 and composite[k-1] after. */
const wkLabel = k => k === 0 ? 'preseason' : (k === DATA.final_key ? 'final poll' : 'after wk ' + (k - 1));
function compositeFor(k){
  if (k === weeks[weeks.length-1]) return DATA.current;
  return (k === 0 ? DATA.composite['pre'] : DATA.composite[String(k - 1)]) || [];
}
function ballotPanel(id){
  const v = DATA.voters.find(x => x.id === id);
  if (!weeks.length) return `<div class="panel"><h3>${esc(v.name)}</h3><p class="empty">No ballots filed yet — the first poll comes with week 0.</p></div>`;
  const b = DATA.ballots[String(week)][id] || [];
  const comp = compositeFor(week);
  const cpos = {}; comp.forEach((t,i) => cpos[t] = i+1);
  const pi = weeks.indexOf(week);
  const prevB = pi > 0 ? (DATA.ballots[String(weeks[pi-1])][id] || []) : null;
  const rows = b.map((t,i) => {
    const c = cpos[t]; const d = c ? c - (i+1) : null;
    const mv = d === null ? '<span class="mv">NR</span>' : d === 0 ? '<span class="mv">=</span>' : d > 0 ? `<span class="mv up">+${d}</span>` : `<span class="mv down">${d}</span>`;
    let own = '';
    if (prevB){
      const p = prevB.indexOf(t);
      own = p < 0 ? '<span class="mv up">NEW</span>' : p === i ? '<span class="mv">—</span>' : p > i ? `<span class="mv up">▲${p - i}</span>` : `<span class="mv down">▼${i - p}</span>`;
    }
    return `<tr><td class="r">${i+1}</td><td>${own}</td><td><span class="dot" style="background:${DATA.colors[t][0]}"></span>${esc(t)}${t===v.team?' <span class="chip">own school</span>':''}</td><td class="r">${rec(t)}</td><td class="r">${c||'—'}</td><td>${mv}</td></tr>`;
  }).join('');
  const dropped = prevB ? prevB.filter(t => !b.includes(t)) : [];
  return `<div class="panel"><h3>${esc(v.name)} — ballot, ${wkLabel(week)}</h3>
    <div class="wk">${weeks.map(w => `<button data-w="${w}" aria-pressed="${w===week}">${wkLabel(w)}</button>`).join('')}</div>
    <div style="overflow-x:auto"><table><tr><th>#</th><th>${prevB ? 'moved' : ''}</th><th>team</th><th>rec</th><th>poll</th><th>vs poll</th></tr>${rows}</table></div>
    ${dropped.length ? `<p class="empty"><b>Dropped:</b> ${dropped.map(esc).join(', ')}</p>` : ''}</div>`;
}
function move(t, i){
  const prev = DATA.prev || []; if (!prev.length) return '';
  const p = prev.indexOf(t);
  if (p < 0) return '<span class="mv up">NEW</span>';
  const d = p - i;
  return d === 0 ? '<span class="mv">—</span>' : d > 0 ? `<span class="mv up">▲${d}</span>` : `<span class="mv down">▼${-d}</span>`;
}
function poll(){
  if (!DATA.current.length) return '<p class="empty">No poll yet.</p>';
  const ranked = new Set(DATA.current);
  const rows = DATA.current.map((t,i) => `<tr><td class="r">${i+1}</td><td>${move(t,i)}</td><td><span class="dot" style="background:${DATA.colors[t][0]}"></span>${esc(t)}</td><td class="r">${rec(t)}</td><td class="r">${DATA.points[t]||0}</td><td class="r">${DATA.firsts[t]||''}</td></tr>`).join('');
  const others = Object.entries(DATA.points).filter(([t]) => !ranked.has(t)).sort((a,b) => b[1]-a[1]);
  const dropped = (DATA.prev || []).filter(t => !ranked.has(t));
  return `<div class="panel"><h3>Composite poll</h3>
    ${DATA.prev && DATA.prev.length ? `<p class="empty">Movement vs ${esc(DATA.prev_label || 'last week')}.</p>` : ''}
    <div style="overflow-x:auto"><table><tr><th>#</th><th></th><th>team</th><th>rec</th><th>pts</th><th>1st</th></tr>${rows}</table></div>
    ${others.length ? `<p class="empty" style="margin-top:10px"><b>Others receiving votes:</b> ${others.map(([t,p]) => esc(t) + ' ' + p).join(', ')}</p>` : ''}
    ${dropped.length ? `<p class="empty"><b>Dropped out:</b> ${dropped.map(t => esc(t)).join(', ')}</p>` : ''}
  </div>`;
}
function render(){ tabs(); el('main').innerHTML = view === 'board' ? board() : poll(); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-v]'); if (t){ view = t.dataset.v; render(); return; }
  const w = e.target.closest('[data-w]'); if (w){ week = Number(w.dataset.w); render(); return; }
  const c = e.target.closest('.card'); if (c){ sel = sel === c.dataset.id ? null : c.dataset.id; render(); window.scrollTo({top:0,behavior:'smooth'}); }
});
render();
</script>
