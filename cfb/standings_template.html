<title>Roiland CFB Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--fg:#1d1b17;--mute:#6f6a5e;--line:#ddd6c6;--acc:#a8341f;--acc2:#1f5f4a;--chip:#ece6d8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14130f;--card:#1d1b16;--fg:#efe9db;--mute:#a39c8a;--line:#34302a;--acc:#e0694f;--acc2:#6cc0a1;--chip:#2a2721;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14130f;--card:#1d1b16;--fg:#efe9db;--mute:#a39c8a;--line:#34302a;--acc:#e0694f;--acc2:#6cc0a1;--chip:#2a2721;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.4 Inter,system-ui,sans-serif;padding-inline:16px;padding-block:20px 48px;max-width:640px;margin-inline:auto;overflow-x:clip}
h1{font:800 30px/1.05 Fraunces,Georgia,serif;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--mute);font-size:13px;margin:0 0 16px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.tabs button{font:600 12.5px Inter,sans-serif;border:0;background:transparent;color:var(--mute);padding:10px 2px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.ctl{display:flex;gap:6px;align-items:center;margin:0 0 10px}
.ctl select{flex:1;min-width:0;font:500 14px Inter,sans-serif;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.ctl button{font:600 13px Inter,sans-serif;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.note{font-size:12px;color:var(--mute);margin:0 0 10px}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rk{font:500 12px 'IBM Plex Mono',monospace;color:var(--mute);text-align:right}
.nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.cf{font-weight:400;color:var(--mute);font-size:12px;margin-left:6px}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums}
.big{font:800 26px/1 Fraunces,Georgia,serif;color:var(--acc);text-align:right;font-variant-numeric:tabular-nums}
.big small{display:block;font:500 10px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.new{color:var(--acc2);font-weight:600}
.more{display:block;width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 13px Inter,sans-serif}
.yr{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.yr:first-child{border-top:0}.yr b{font:500 13px 'IBM Plex Mono',monospace;color:var(--mute)}
.yr span{color:var(--mute);font-size:13px}
.bar{height:4px;border-radius:2px;background:var(--chip);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc2)}
.tier{display:inline-block;font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.06em;padding:1px 5px;border-radius:4px;background:var(--chip);color:var(--mute);margin-left:6px;vertical-align:2px}
.crow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.card .crow:first-child{border-top:0}
.go{color:var(--acc2);font-size:12px;font-weight:600}
.sec{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
</style>
<h1>Roiland CFB Standings</h1>
<p class="sub" id="sub"></p>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-t="t">Titles</button><button role="tab" aria-selected="false" data-t="p">Playoffs</button><button role="tab" aria-selected="false" data-t="c">Conferences</button><button role="tab" aria-selected="false" data-t="y">Champions</button></div>
<div id="v"></div>
<script>
const D=__DATA__;
const v=document.getElementById('v');let tab='t',conf='',all={t:false,p:false};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TIER=Object.fromEntries(D.confs.map(c=>[c.c,c.tier]));
document.getElementById('sub').textContent='Through the '+D.through+' season · champion '+D.champ[0]+(D.champ[1]?' (def. '+D.champ[1]+')':'');
function confSel(){const o=['<option value="">All conferences</option>'].concat(D.confs.map(c=>`<option value="${esc(c.c)}"${conf===c.c?' selected':''}>${esc(c.c)} · ${c.tier}</option>`));
 return `<div class="ctl"><select id="cs" aria-label="conference">${o.join('')}</select>${conf?'<button data-clr="1">Clear</button>':''}</div>`}
function titles(){const rows=D.titles.filter(r=>r.ti>0&&(!conf||r.c===conf));const cap=conf?rows.length:20;const n=all.t?rows.length:cap;let rk=0,prev=null;
 let h=confSel()+`<p class="note">National championships since 1929 (shared titles count in full), by current conference membership. Runner-ups in the small print.</p><div class="card">`;
 if(!rows.length)h+='<p class="note" style="padding:10px 0">No national titles yet for this conference’s current members.</p>';
 rows.slice(0,n).forEach((r,idx)=>{if(r.ti!==prev){rk=idx+1;prev=r.ti}
  h+=`<div class="row"><div class="rk">${rk}</div><div><div class="nm">${esc(r.t)}${conf?'':`<span class="cf">${esc(r.c||'')}</span>`}</div><div class="meta"><span>${r.ru} runner-up</span><span>last ${r.last}</span>${r.since?`<span class="new">${r.since} since 2026</span>`:''}</div></div><div class="big">${r.ti}<small>title${r.ti==1?'':'s'}</small></div></div>`});
 h+='</div>';if(rows.length>cap)h+=`<button class="more" data-more="t">${all.t?'Show top 20':'Show all '+rows.length+' champions'}</button>`;return h}
function po(){const rows=D.po.filter(r=>!conf||r.c===conf);const cap=conf?rows.length:25;const n=all.p?rows.length:cap;
 let h=confSel()+`<p class="note">24-team playoff, ${D.po_years}, from every playoff game on record. Ranked by titles, then title games, semifinals, wins.</p><div class="card">`;
 rows.slice(0,n).forEach((r,i)=>{const pct=Math.round(100*r.W/Math.max(1,r.W+r.L));
  h+=`<div class="row"><div class="rk">${i+1}</div><div><div class="nm">${esc(r.t)}${conf?'':`<span class="cf">${esc(r.c||'')}</span>`}</div><div class="meta"><span>${r.apps} apps</span><span>${r.W}–${r.L}</span><span>${r.qf} QF</span><span>${r.sf} SF</span><span>${r.fin} final${r.fin==1?'':'s'}</span><span>last ${r.last}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div><div class="big">${r.ti}<small>title${r.ti==1?'':'s'}</small></div></div>`});
 h+='</div>';if(rows.length>cap)h+=`<button class="more" data-more="p">${all.p?'Show top 25':'Show all '+rows.length+' playoff teams'}</button>`;return h}
function confs(){
 const block=t=>{const cs=D.confs.filter(c=>c.tier===t).sort((a,b)=>b.ti-a.ti||b.fin-a.fin||b.W-a.W);
  return `<div class="sec">${t==='P6'?'Power 6':'Group of 6'}</div><div class="card">`+cs.map((c,i)=>{const pct=Math.round(100*c.W/Math.max(1,c.W+c.L));
   return `<button class="crow" data-conf="${esc(c.c)}"><div class="rk">${i+1}</div><div style="min-width:0"><div class="nm">${esc(c.c)}<span class="tier">${c.n} teams</span></div>
   <div class="meta"><span>${c.since} since 2026</span><span>${c.apps} playoff apps</span><span>${c.W}–${c.L}</span><span>${c.sf} SF</span><span>${c.fin} final${c.fin==1?'':'s'}</span></div>
   <div class="meta">${c.champs.length?'Most: '+c.champs.map(esc).join(', '):'No national champion among current members'}</div><div class="bar"><i style="width:${pct}%"></i></div></div>
   <div class="big">${c.ti}<small>titles</small></div></button>`}).join('')+'</div>'};
 return `<p class="note">Every title and playoff result credited to each conference’s CURRENT members (titles since 1929; playoff ${D.po_years}). Tap a conference to see its teams.</p>`+block('P6')+block('L6')}
function yrs(){let h='<p class="note">Title game winners and runners-up, 24-team era.</p><div class="card">';
 D.years.slice().reverse().forEach(r=>{h+=`<div class="yr"><b>${r.y}</b><div><div class="nm">${esc(r.w)}</div><span>def. ${esc(r.r)}</span></div></div>`});return h+'</div>'}
function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.t===t));draw();window.scrollTo(0,0)}
function draw(){v.innerHTML=tab=='t'?titles():tab=='p'?po():tab=='c'?confs():yrs();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t){setTab(b.dataset.t)}
 else if(b.dataset.more){all[b.dataset.more]=!all[b.dataset.more];draw()}
 else if(b.dataset.conf){conf=b.dataset.conf;setTab('t')}
 else if(b.dataset.clr){conf='';draw()}});
document.addEventListener('change',e=>{if(e.target.id==='cs'){conf=e.target.value;draw()}});
draw();
</script>
